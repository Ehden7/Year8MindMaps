<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West African Kingdoms - Mock Test Mind Map</title>
<style>
  :root{--bg:#FFF8EC;--panel:#FFFFFF;--panel2:#F3F0FF;--line:#E6DFF5;--text:#2b2a33;--muted:#6b6878;--warn:#B7791F;--good:#1E9E5A;--bad:#D9541E;--purple:#7C5CFF}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#FFF3DC 0,#FDEBFF 45%,#E6F4FF 100%) fixed;min-height:100vh}
  .rainbow{height:7px;background:linear-gradient(90deg,#FF6B6B,#FFA94D,#FFD43B,#69DB7C,#4DABF7,#9775FA,#F783AC)}
  header{padding:18px 26px 8px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
  h1{margin:0;font-size:26px;background:linear-gradient(90deg,#E8743B,#F0A500,#2DAA6B,#2F8FE0,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:-1px}
  .tabs{display:flex;gap:8px;padding:6px 26px 0;border-bottom:2px solid var(--line)}
  .tabs button{background:#fff;color:var(--muted);border:2px solid var(--line);border-bottom:none;padding:10px 18px;border-radius:14px 14px 0 0;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:-2px}
  .tabs button[aria-selected="true"]{color:#fff;background:var(--tc);border-color:var(--tc)}
  .modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 26px;border-bottom:1px solid var(--line)}
  .btn{background:#fff;color:var(--text);border:2px solid #D8D0EE;padding:8px 14px;border-radius:12px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--purple)}
  .btn.on{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn.go{border-color:var(--good);color:#fff;background:var(--good)}
  .btn.stop{border-color:var(--bad);color:var(--bad)}
  .btn.small{padding:5px 10px;font-size:13px}
  button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #7C5CFF;outline-offset:2px}
  .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;padding:4px 12px;border-radius:12px;border:2px solid var(--warn);color:var(--warn);background:#FFF6DB}
  .timer.low{border-color:var(--bad);color:var(--bad);background:#FFE9DF}
  .info{color:var(--muted);font-size:13.5px}
  .spacer{margin-left:auto}
  main{padding:16px 26px 8px;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:start}
  @media (max-width:1150px){main{grid-template-columns:1fr}}
  .mapbox{background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:18px;padding:6px}
  svg{width:100%;height:auto;display:block}
  .link{fill:none;stroke-width:2.6;opacity:.6}
  .node{cursor:pointer}
  .node text{pointer-events:none}
  .node.off{opacity:.4;cursor:not-allowed}
  .node.sel rect{stroke-width:3.4;filter:drop-shadow(0 0 6px var(--glow))}
  .panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;box-shadow:0 6px 24px -14px #7C5CFF}
  .panel h2{margin:0 0 4px;font-size:20px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--c);color:var(--d,var(--c));background:color-mix(in srgb,var(--c) 14%,#fff);margin-bottom:8px}
  .ph{color:var(--muted);font-size:14px;line-height:1.55}
  .task{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
  .task h3{margin:0 0 6px;font-size:15px}
  .task h3 small{color:var(--muted);font-weight:400}
  .src{background:color-mix(in srgb,var(--c) 14%,#fff);border-left:4px solid var(--c);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.5;margin:6px 0}
  .src b{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
  .q{font-size:15px;font-weight:700;margin:8px 0 6px;line-height:1.4}
  .starts{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:6px}
  textarea{width:100%;min-height:130px;resize:vertical;background:#FBFAFF;color:var(--text);border:2px solid #D8D0EE;border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px;line-height:1.5}
  .wc{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0 8px}
  .box{background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.5}
  .box h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:3px 9px;border-radius:999px;border:2px solid #D8D0EE;color:var(--muted);background:#fff}
  .chip.hit{border-color:var(--good);color:var(--good);background:#E4F8EC;font-weight:700}
  .ticks label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px;cursor:pointer}
  .ticks input{margin-top:3px;accent-color:#1E9E5A;width:16px;height:16px}
  .score{font-size:22px;font-weight:800;margin-top:6px;color:var(--purple)}
  .model{border-left:4px solid #F0A500;background:#FFF6DB;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:8px}
  .model b{color:var(--warn)}
  .results{padding:6px 26px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .rc{background:#fff;border:2px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:12px 14px}
  .rc b{display:block;font-size:15px;color:var(--d,var(--c))}
  .rc .n{font-size:24px;font-weight:800;margin:4px 0}
  .bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--c);width:0;transition:width .4s}
  .rc small{color:var(--muted);font-size:12.5px}
  footer{color:#8a8698;font-size:12px;padding:0 26px 22px}

  /* quick questions */
  .qz{max-width:900px;margin:0 auto;padding:18px 26px 30px}
  .qz .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .qz .lab{font-size:13px;color:var(--muted);font-weight:700;margin-right:2px}
  .pill{background:#fff;color:var(--text);border:2px solid var(--c,#D8D0EE);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600}
  .pill[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c)}
  .pill small{opacity:.8;font-weight:500;margin-left:4px}
  .qcard{background:#fff;border:2px solid var(--line);border-top:8px solid var(--c);border-radius:20px;padding:22px 24px;margin-top:12px;box-shadow:0 10px 30px -18px var(--c)}
  .qcat{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:999px;background:var(--c);color:#fff;margin-right:6px}
  .qk{font-size:12.5px;color:var(--muted);font-weight:700}
  .qtext{font-size:22px;font-weight:800;margin:14px 0;line-height:1.35}
  .qin{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2px solid #D8D0EE;border-radius:12px;background:#FBFAFF;color:var(--text)}
  .qres{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:16px;line-height:1.5}
  .qres.ok{background:#E4F8EC;border:2px solid var(--good)}
  .qres.no{background:#FFE9DF;border:2px solid var(--bad)}
  .qres b{display:block;margin-bottom:2px}
  .qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .qprog{height:10px;background:#fff;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
  .qprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF6B6B,#FFA94D,#FFD43B,#69DB7C,#4DABF7,#9775FA);transition:width .3s}
  .qstat{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
  .miss{margin-top:10px;font-size:14.5px}
  .miss div{padding:6px 0;border-top:1px dashed var(--line)}
  .big{font-size:42px;font-weight:900;color:var(--purple)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="rainbow"></div>
<header>
  <div>
    <h1>West African Kingdoms · Mock Test</h1>
    <div class="sub">Year 8 History · Open answers · Click a box on the map to answer</div>
  </div>
  <div class="legend">
    <span style="--c:#F0A500">Mali</span><span style="--c:#2F8FE0">Songhay</span><span style="--c:#E8743B">Benin</span><span style="--c:#2DAA6B">Asante</span>
  </div>
</header>

<div class="tabs" role="tablist">
  <button role="tab" id="tb1" aria-selected="true" style="--tc:#7C5CFF">1 · Mind map test</button>
  <button role="tab" id="tb2" aria-selected="false" style="--tc:#E8743B">2 · Quick questions</button>
</div>
<div id="tTest">
<div class="modebar" id="modebar"></div>

<main>
  <div class="mapbox"><svg id="mm" viewBox="0 0 1200 780" role="img" aria-label="Mind map of the 16 lessons. Click a lesson to answer its questions."></svg></div>
  <div class="panel" id="panel" aria-live="polite"></div>
</main>

<div class="results" id="results"></div>
<footer>Your answers are saved on this computer, in this browser only. Nothing is sent anywhere. You mark your own answers using the tick lists.</footer>
</div>
<div id="tQuiz" style="display:none"></div>

<script>
const K={mali:{n:"Mali",c:"#F0A500",p:"#FFE08A",d:"#8A5A00"},songhay:{n:"Songhay",c:"#2F8FE0",p:"#A9D4FA",d:"#1B5FA3"},benin:{n:"Benin",c:"#E8743B",p:"#FFC2A3",d:"#A24313"},asante:{n:"Asante",c:"#2DAA6B",p:"#A5E6C3",d:"#17744A"}};

/* ===== QUESTIONS (edit here) =====
 n lesson no · k kingdom · t title
 src = Source A · iq = impression question · qt = good words to quote · im = model impression answer
 eq = explain-why question · f = facts to include [label, words to look for] · h = model PEEL answer */
const L=[
{n:"01",k:"mali",t:"How do we know?",
 src:"Mali’s skilled craftspeople produced impressive objects, while storytellers carefully preserved memories of rulers and communities. Its history survives in many different forms.",
 iq:"What impression does Source A give of Mali’s culture?",
 qt:["skilled craftspeople","carefully preserved","many different forms"],
 im:"The source gives the impression that Mali had a rich and lasting culture. The words “skilled craftspeople” suggest talented makers, and “carefully preserved” implies that storytellers valued their history, which is why it survives in “many different forms”.",
 eq:"Explain why historians use different kinds of evidence to study Mali.",
 f:[["Oral traditions / griots","griot|oral"],["Buildings or objects","mosque|building|object|metalwork|pottery|sculpture"],["Written accounts / travellers","written|scholar|traveller"],["Comparing / checking","compar|check|bias|cross"]],
 h:"P: Each type of evidence shows only part of the story. E: Griots keep memories alive, but objects such as mosques and metalwork show faith and wealth. E: Comparing them checks for bias, because writers and storytellers choose what to stress. L: So using many kinds of evidence gives historians a fuller, fairer picture of Mali."},
{n:"02",k:"mali",t:"Sunjata & rise of Mali",
 src:"Sunjata united people against a restrictive ruler. His victory at Kirina made him a celebrated leader who offered his supporters a stronger future.",
 iq:"What impression does Source A give of Sunjata’s leadership?",
 qt:["united people","restrictive ruler","celebrated leader"],
 im:"The source gives the impression that Sunjata was a strong and popular leader. “United people” suggests he brought groups together, while “restrictive ruler” implies Samanguru was unfair, so “celebrated leader” suggests Sunjata offered hope.",
 eq:"Explain why Sunjata Keita was important in the rise of Mali.",
 f:[["Samanguru / Susu","samanguru|susu"],["Battle of Kirina","kirina"],["1235","1235"],["Coalition / alliance / united","coalition|alliance|united|unity|allies"],["Became mansa","mansa"]],
 h:"P: He united people against Samanguru. E: He led a coalition and won the Battle of Kirina in 1235, and the Mandinka made him mansa. E: Unity and control of trade gave the new kingdom the resources to grow. L: So Sunjata was important because he founded a strong, united Mali."},
{n:"03",k:"mali",t:"Interpretations of Mali",
 src:"Stories celebrate Sunjata as a courageous hero who brought people together. They keep his achievements alive and give later generations a powerful example of leadership.",
 iq:"What impression does Source A give of how Sunjata is remembered?",
 qt:["courageous hero","keep his achievements alive","powerful example"],
 im:"The source gives the impression that Sunjata is remembered with great respect. “Courageous hero” suggests bravery, and “keep his achievements alive” implies later generations still tell his story as a “powerful example” of leadership.",
 eq:"Explain why interpretations of Mali can differ.",
 f:[["Writers choose evidence","select|choose|emphasi|stress"],["Griots / oral tradition","griot|oral"],["Purpose or audience","purpose|audience"],["New evidence","new evidence"]],
 h:"P: Writers pick different evidence to emphasise. E: A griot may stress Sunjata’s bravery, while a film or book may focus on other events. E: Purpose, audience and new evidence also shape the story that is told. L: So accounts of the same ruler can differ."},
{n:"04",k:"mali",t:"Mansa Musa’s life",
 src:"Mansa Musa was a wealthy and ambitious ruler. He used his resources to strengthen his kingdom and support religious life and learning.",
 iq:"What impression does Source A give of Mansa Musa as a ruler?",
 qt:["wealthy and ambitious","strengthen his kingdom","religious life and learning"],
 im:"The source gives the impression that Musa was a powerful and thoughtful ruler. “Wealthy and ambitious” suggests he wanted more power, and “support religious life and learning” implies he also cared about faith and education.",
 eq:"Explain why trade helped Mansa Musa strengthen Mali.",
 f:[["Gold","gold"],["Salt","salt"],["Taxes","tax"],["Army / government paid for","army|government"],["North Africa links","north africa"]],
 h:"P: Trade gave Mali money and power. E: Musa controlled gold and salt routes and collected taxes from traders. E: This income paid for his army and government. L: So trade helped him make Mali stronger."},
{n:"05",k:"mali",t:"Mansa Musa’s Hajj",
 src:"Musa’s remarkable pilgrimage displayed extraordinary wealth, but it also revealed his devotion to Islam and enthusiasm for knowledge. His journey brought Mali to wider attention.",
 iq:"What impression does Source A give of Musa’s pilgrimage?",
 qt:["remarkable","extraordinary wealth","devotion to Islam","wider attention"],
 im:"The source gives the impression that the Hajj was impressive and meaningful. “Extraordinary wealth” suggests Mali was very rich, while “devotion to Islam” implies Musa was sincere in his faith, and “wider attention” shows Mali became famous.",
 eq:"Explain why Mansa Musa’s Hajj was important for Mali.",
 f:[["1324","1324"],["Cairo / gold value","cairo"],["Scholars / learning","scholar|learning|education"],["Mosques (Djinguereber)","mosque|djinguereber"],["Reputation / fame","reputation|fame|famous|attention|known"]],
 h:"P: The Hajj spread Mali’s fame across the world. E: In 1324 his gifts and spending in Cairo changed the value of gold there. E: People learned how rich Mali was, and he returned with scholars and built mosques. L: So the Hajj boosted Mali’s reputation and learning."},
{n:"06",k:"mali",t:"Decline of Mali",
 src:"Rival rulers struggled for power while valuable trading centres slipped away. Mali’s divisions weakened its ability to defend the wealth on which its strength depended.",
 iq:"What impression does Source A give of Mali during its decline?",
 qt:["Rival rulers struggled","slipped away","divisions weakened"],
 im:"The source gives the impression that Mali was losing control. “Rival rulers struggled” suggests constant fighting, and “slipped away” implies trade was being lost, so “divisions weakened” its defence.",
 eq:"Explain why Mali declined after Mansa Musa.",
 f:[["Succession disputes / rivals","succession|rival|dispute"],["Weak defence / division","defen|divid|division|weak"],["Lost trading centres / revenue","trading centre|revenue|income|trade"],["Songhay took over","songhay"]],
 h:"P: Fights over succession weakened Mali. E: Rival branches of the family competed, and reigns were short and violent. E: This division made defence harder, so trading centres were lost and revenue fell. L: So Songhay was able to take over Mali’s land and trade."},
{n:"07",k:"songhay",t:"Rise of Songhay",
 src:"Gao was a flourishing meeting place where river transport, farming and trade supported one another. Its expanding connections helped Songhay grow powerful.",
 iq:"What impression does Source A give of Gao’s importance?",
 qt:["flourishing meeting place","supported one another","expanding connections"],
 im:"The source gives the impression that Gao was a busy and successful centre. “Flourishing meeting place” suggests people and goods came together there, and “supported one another” implies farming, river transport and trade all helped Songhay grow.",
 eq:"Explain why Gao helped Songhay rise to power.",
 f:[["Niger River","niger|river"],["Trade goods (gold, kola nuts…)","gold|kola|leather|dates|trade"],["Farming / Sorko / fishing","farm|sorko|fish"],["Arab traders / Islam","arab|islam"]],
 h:"P: Gao’s place on the Niger River made Songhay rich and connected. E: River transport carried food, people and goods such as gold and kola nuts. E: Trade brought wealth and contacts with Arab traders. L: So Gao helped Songhay grow powerful."},
{n:"08",k:"songhay",t:"Life & Sonni Ali",
 src:"Songhay’s bustling river towns depended on boats, farms and merchants. Yet military expansion could bring fear and suffering to people who resisted the ruler.",
 iq:"What impression does Source A give of life under Songhay’s expanding power?",
 qt:["bustling river towns","Yet","fear and suffering"],
 im:"The source gives a mixed impression. “Bustling river towns” suggests a lively, successful economy, but the word “Yet” signals a change, and “fear and suffering” implies people who resisted the ruler were treated harshly.",
 eq:"Explain why the Niger River was important to Songhay.",
 f:[["Transport / trade","transport|trade"],["River fleet / cavalry","fleet|cavalry|boat"],["Timbuktu or Djenne","timbuktu|djenne"],["Cut off supplies / food","suppl|food"],["Sonni Ali","sonni"]],
 h:"P: The river gave Songhay both transport and military power. E: It carried food and goods, and Sonni Ali’s river fleet moved soldiers. E: It cut off enemy supplies and helped him take Timbuktu and Djenne. L: So the Niger gave Songhay wealth and strength."},
{n:"09",k:"songhay",t:"Fall of Songhay",
 src:"Songhay was dangerously divided when a determined outside enemy attacked. Rivalries had weakened the unity needed to defend its valuable trading empire.",
 iq:"What impression does Source A give of Songhay’s vulnerability?",
 qt:["dangerously divided","determined outside enemy","Rivalries had weakened"],
 im:"The source gives the impression that Songhay was an easy target. “Dangerously divided” suggests a serious weakness, and “determined outside enemy” implies a strong attacker, while “Rivalries had weakened” shows unity was lost.",
 eq:"Explain why internal conflict contributed to Songhay’s decline.",
 f:[["Civil war","civil war"],["1588 / Askia Ishaq II","1588|ishaq"],["Succession / division","succession|divid|division|rival"],["Morocco / Mulay Ahmed","morocc|mulay"],["Hard to defend","defen"]],
 h:"P: Fights over who should rule weakened Songhay. E: Civil war broke out in 1588 when Askia Ishaq II took power. E: A divided empire could not organise its defence. L: So Morocco’s invasion could succeed."},
{n:"10",k:"songhay",t:"Askia the Great",
 src:"Askia was an energetic ruler who valued both military strength and scholarship. His support for education helped restore cooperation between rulers and learned men.",
 iq:"What impression does Source A give of Askia’s leadership?",
 qt:["energetic ruler","valued both","restore cooperation"],
 im:"The source gives the impression that Askia was a balanced and effective leader. “Energetic ruler” suggests he was active, and “valued both” military strength and scholarship implies he balanced power with learning, helping to “restore cooperation”.",
 eq:"Explain why Askia Mohammed became known as Askia the Great.",
 f:[["1493 / took power","1493"],["Hajj 1496","hajj|1496"],["Al-Maghili / scholars","maghili|scholar"],["Education: Timbuktu, Gao","educat|timbuktu|gao"],["Army / expanded land","army|military|territory|expand"]],
 h:"P: He is remembered for supporting faith and learning as well as strong rule. E: He took power in 1493, made the Hajj in 1496, took advice from Al-Maghili and supported education in Timbuktu and Gao. E: Scholars wrote positively about him. L: So he is called ‘the Great’, although his failed attack on Borgu in 1505 shows he had limits."},
{n:"11",k:"benin",t:"Kingdom of Benin",
 src:"The Oba stood at the centre of a powerful kingdom. Royal descent, impressive buildings and carefully crafted artworks reinforced the ruler’s authority.",
 iq:"What impression does Source A give of the Oba’s power?",
 qt:["stood at the centre","powerful kingdom","reinforced the ruler’s authority"],
 im:"The source gives the impression that the Oba was the most important person in Benin. “Stood at the centre” suggests everything depended on him, and “reinforced the ruler’s authority” implies buildings and art kept his power strong.",
 eq:"Explain why royal authority was important in the Kingdom of Benin.",
 f:[["Eweka","eweka"],["Oba","oba"],["Edo people / Edo mother","edo"],["c.1200","1200"],["Oranmiyan / Ife","oranmiyan|ife"]],
 h:"P: Royal authority united the Edo people. E: Eweka, who had an Edo mother, became the founding Oba around 1200. E: His local roots made his rule accepted, and later warrior Obas expanded the kingdom. L: So strong royal authority held Benin together."},
{n:"12",k:"benin",t:"Benin Bronzes",
 src:"The magnificent artworks place the Oba at the centre, larger and more richly dressed than his attendants. Every detail emphasises royal wealth, authority and prestige.",
 iq:"What impression does Source A give of the status of the Oba?",
 qt:["magnificent","larger and more richly dressed","wealth, authority and prestige"],
 im:"The source gives the impression that the Oba had very high status. “Larger and more richly dressed” suggests he was far more important than his attendants, and “wealth, authority and prestige” implies the art was meant to show his power.",
 eq:"Explain why the Benin Bronzes are valuable historical evidence.",
 f:[["Oba central and larger","central|larger|bigger|centre"],["Coral = wealth","coral|wealth"],["Kneeling attendants / hierarchy","kneel|hierarch|attendant"],["Europeans / overseas contact","europe|overseas"],["Queen Idia / ivory mask","idia|ivory|iyoba"]],
 h:"P: The Bronzes record court life. E: The Oba is shown larger and central, with coral ornaments and kneeling attendants, and Europeans appear on some plaques. E: This shows status, hierarchy and overseas trade. L: So they help historians understand Benin, especially when used with oral and written sources."},
{n:"13",k:"benin",t:"Benin & Europe",
 src:"The British invasion devastated the city and stripped the palace of precious historical objects. The loss of independence also separated Benin’s people from important parts of their cultural heritage.",
 iq:"What impression does Source A give of the impact of the 1897 invasion?",
 qt:["devastated","stripped the palace","separated Benin’s people"],
 im:"The source gives the impression that the invasion caused huge, lasting damage. “Devastated” suggests destruction, “stripped the palace” implies objects were taken by force, and “separated Benin’s people” from their heritage shows the loss went beyond buildings.",
 eq:"Explain why the Sack of Benin had lasting consequences.",
 f:[["1897","1897"],["Palace looted","loot|palace"],["Oba exiled","exile|oba"],["Lost independence / colonial rule","independen|colonial|british control"],["Artworks taken abroad","art|object|museum|collection|abroad"]],
 h:"P: The Sack of Benin removed objects and independence. E: In 1897 British forces burned Benin City, looted the palace and exiled the Oba. E: Artworks were scattered overseas, so Benin lost access to its own heritage and its freedom. L: So the effects of the invasion still matter today."},
{n:"14",k:"asante",t:"Founding of Asante",
 src:"The Golden Stool represented the soul of the whole people. Together with Osei Tutu’s leadership, it gave separate communities a powerful symbol of common identity.",

const TICKS={
 i:["States the overall impression clearly","Quotes short words from the source","Explains what the first word suggests","Explains a second word or detail"],
 e:["P · Clear point that answers the question","E · Specific evidence: names, dates, events","E · Explains how or why it proves the point","L · Links back to the question"]
};
const STARTS={
 i:"The source gives the impression that… · This is shown by the words “…” · This suggests… because… · The word “…” also implies…",
 e:"P: One reason was… · E: For example (name, date, event)… · E: This meant that… because… · L: Therefore…"
};

/* ===== STATE ===== */
const KEY="wak_mock_v1";
let store={p:{},x:{},exam:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)store=Object.assign(store,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
let view=(store.exam&&!store.exam.done)?"exam":"practice";
let sel=null, tick=null;
const S=()=>view==="exam"?store.x:store.p;
const examDone=()=>store.exam&&store.exam.done;
const $=id=>document.getElementById(id);
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const lessonOf=n=>L.find(l=>l.n===n);

/* ===== EXAM ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newExam(){
  const pick=(k,c)=>shuffle(L.filter(l=>l.k===k)).slice(0,c);
  const ls=shuffle([...pick("mali",2),...pick("songhay",2),...pick("benin",1),...pick("asante",1)]);
  const types=shuffle(["i","i","i","e","e","e"]);
  store.exam={ids:ls.map((l,i)=>l.n+types[i]),start:Date.now(),dur:30*60,done:false};
  store.x={};save();view="exam";sel=null;draw();modebar();panelHome();results();tickTimer();
}
function examTasksFor(n){return store.exam?store.exam.ids.filter(id=>id.slice(0,2)===n).map(id=>id[2]):[]}
function finishExam(){if(store.exam){store.exam.done=true;save();clearInterval(timer);draw();modebar();sel?openLesson(sel):panelHome();results()}}
let timer=null;
function remaining(){return Math.max(0,store.exam.dur-Math.floor((Date.now()-store.exam.start)/1000))}
function tickTimer(){
  clearInterval(timer);
  if(!store.exam||store.exam.done)return;
  const upd=()=>{const r=remaining(),el=$("tm");if(el){el.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");el.classList.toggle("low",r<300)}if(r<=0)finishExam()};
  upd();timer=setInterval(upd,1000);
}

/* ===== MODE BAR ===== */
function modebar(){
  const m=$("modebar");let h=`<button class="btn ${view==="practice"?"on":""}" id="bP">Free practice · all 32 questions</button>
  <button class="btn ${view==="exam"?"on":""}" id="bX">Exam simulation · 6 questions · 30 min</button>`;
  if(view==="exam"){
    if(!store.exam)h+=`<span class="info">Press the exam button again to start.</span>`;
    else if(!store.exam.done)h+=`<span class="timer" id="tm" aria-live="off">--:--</span><button class="btn go" id="bF">Finish and mark</button><span class="info">Mark scheme stays hidden until you finish.</span>`;
    else{const sc=examScore();h+=`<span class="timer" style="border-color:var(--good);color:var(--good)">${sc.got} / ${sc.max}</span><button class="btn" id="bN">New exam</button><span class="info">Tick your marks in each question to update the score.</span>`}
  }
  h+=`<span class="spacer"></span><button class="btn small stop" id="bC">Clear all answers</button>`;
  m.innerHTML=h;
  $("bP").onclick=()=>{view="practice";sel=null;draw();modebar();panelHome();results()};
  $("bX").onclick=()=>{if(!store.exam){newExam();return}view="exam";sel=null;draw();modebar();panelHome();results();tickTimer()};
  if($("bF"))$("bF").onclick=finishExam;
  if($("bN"))$("bN").onclick=newExam;
  $("bC").onclick=()=>{if(confirm("Delete all your answers and marks from this computer?")){store={p:{},x:{},exam:null};save();clearInterval(timer);view="practice";sel=null;draw();modebar();panelHome();results()}};
}
function examScore(){
  let got=0,max=0;store.exam.ids.forEach(id=>{max+=4;const s=store.x[id];if(s&&s.t)got+=s.t.filter(Boolean).length});return{got,max};
}

/* ===== MIND MAP ===== */
const NS="http://www.w3.org/2000/svg",svg=$("mm"),CX=600,CY=390;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const curve=(x1,y1,x2,y2)=>{const m=(x1+x2)/2;return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`};
function status(l){
  const ts=(view==="exam"?examTasksFor(l.n):["i","e"]);
  if(!ts.length)return{off:true,txt:"Not in this test",lvl:0};
  const s=S();let w=0,r=0;
  ts.forEach(t=>{const o=s[l.n+t]||{};if(o.a&&o.a.trim())w++;if(o.rev||(view==="exam"&&examDone()&&o.a))r++});
  const lvl=r===ts.length?2:w>0?1:0;
  const kind=view==="exam"?(ts[0]==="i"?"Impression":"Explain why"):"2 questions";
  return{off:false,lvl,txt:lvl===2?"✓ marked · "+kind:lvl===1?"written · "+kind:kind};
}
function layoutSide(keys,x0,xb,pos){
  const g={};keys.forEach(k=>g[k]=L.filter(l=>l.k===k));
  const total=keys.reduce((s,k)=>s+g[k].length,0)+(keys.length-1)*.7,step=740/total;let y=20+step/2;
  keys.forEach(k=>{const ys=[];g[k].forEach(l=>{pos[l.n]={x:x0,y};ys.push(y);y+=step});pos[k]={x:xb,y:(ys[0]+ys[ys.length-1])/2};y+=step*.7});
}
function draw(){
  svg.innerHTML="";const pos={};
  layoutSide(["mali","benin"],140,410,pos);layoutSide(["songhay","asante"],1060,790,pos);
  const lg=el("g",{}),ng=el("g",{});
  Object.keys(K).forEach(k=>{
    el("path",{d:curve(CX,CY,pos[k].x,pos[k].y),stroke:K[k].c,class:"link","stroke-width":3.2},lg);
    L.filter(l=>l.k===k).forEach(l=>el("path",{d:curve(pos[k].x,pos[k].y,pos[l.n].x,pos[l.n].y),stroke:K[k].c,class:"link"},lg));
  });
  const box=(x,y,w,h,c,fill,rx,sw,par)=>el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,rx,fill,stroke:c,"stroke-width":sw},par);
  // centre
  let g=el("g",{class:"node",tabindex:0,role:"button","aria-label":"Mock test overview"},ng);
  box(CX,CY,230,84,"#7C5CFF","#7C5CFF",18,0,g).setAttribute("fill-opacity",.95);
  el("text",{x:CX,y:CY-6,"text-anchor":"middle","font-size":19,"font-weight":800,fill:"#fff"},g).textContent="Mock Test";
  el("text",{x:CX,y:CY+15,"text-anchor":"middle","font-size":12,fill:"#EDE8FF"},g).textContent=view==="exam"?"Exam simulation":"Free practice";
  g.onclick=()=>{sel=null;draw();panelHome()};g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.onclick()}};
  Object.keys(K).forEach(k=>{
    const p=pos[k],gg=el("g",{class:"node",tabindex:-1,"aria-hidden":"true"},ng);
    box(p.x,p.y,150,52,K[k].c,K[k].p,14,2.5,gg);
    el("text",{x:p.x,y:p.y+6,"text-anchor":"middle","font-size":18,"font-weight":800,fill:"#1d1b26"},gg).textContent=K[k].n;
    gg.style.cursor="default";
  });
  L.forEach(l=>{
    const p=pos[l.n],st=status(l),c=K[l.k].c;
    const g=el("g",{class:"node"+(st.off?" off":"")+(sel===l.n?" sel":""),tabindex:st.off?-1:0,role:"button","aria-label":"Lesson "+l.n+" "+l.t+". "+st.txt,style:"--glow:"+c},ng);
    box(p.x,p.y,236,46,c,st.lvl===2?"#D8F5E3":st.lvl===1?"#FFF1C2":"#FFFFFF",10,1.6,g);
    el("text",{x:p.x,y:p.y-3,"text-anchor":"middle","font-size":13.5,"font-weight":700,fill:"#2b2a33"},g).textContent=l.n+"  "+l.t;
    el("text",{x:p.x,y:p.y+13,"text-anchor":"middle","font-size":11.5,fill:st.lvl===2?"#17744A":st.lvl===1?"#8A5A00":K[l.k].d,"font-weight":600},g).textContent=st.txt;
    if(!st.off){g.onclick=()=>openLesson(l.n);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLesson(l.n)}}}
  });
}

/* ===== PANEL ===== */
const panel=$("panel");
function panelHome(){
  let h=`<h2>How this works</h2>`;
  if(view==="exam"){
    if(!store.exam)h+=`<p class="ph">Press <b>Exam simulation</b> above. You get 6 questions from different lessons and 30 minutes. The mark scheme stays hidden until you finish.</p>`;
    else if(!store.exam.done)h+=`<p class="ph">Your 6 questions are the boxes that are lit up on the map. Click each one and write your answer. Press <b>Finish and mark</b> when you are done.</p><p class="ph">3 impression + 3 explain-why questions = 24 marks.</p>`;
    else{const sc=examScore();h+=`<p class="ph">Time is up. Open each lit box, read the model answer and tick the marks you earned.</p><div class="score">${sc.got} / ${sc.max} marks · ${Math.round(sc.got/sc.max*100)}%</div>`}
  }else h+=`<ol class="ph" style="padding-left:18px;margin:6px 0"><li>Click a lesson box on the map.</li><li>Write your answer in the box. Use full sentences.</li><li>Press <b>Check my answer</b>.</li><li>Read the model answer and tick what you did.</li></ol>
    <p class="ph">Each lesson has 2 questions, 4 marks each. They are the same kinds of question as the revision booklet: <b>Impression</b> and <b>Explain why</b>.</p>`;
  h+=`<div class="box"><h4>Quick reminder</h4>
    <b>Impression:</b> say the view → quote a few words → explain the word → add a second word.<br>
    <b>Explain why (PEEL):</b> Point → Evidence → Explain → Link.</div>`;
  panel.innerHTML=h;
}
function openLesson(n){
  sel=n;draw();
  const l=lessonOf(n),c=K[l.k].c,ts=view==="exam"?examTasksFor(n):["i","e"];
  let h=`<span class="tag" style="--c:${c};--d:${K[l.k].d}">${K[l.k].n} · Lesson ${l.n}</span><h2>${l.t}</h2>`;
  ts.forEach(t=>h+=taskHTML(l,t));
  panel.innerHTML=h;wire(l,ts);
}
function revealed(o){return view==="exam"?examDone():!!o.rev}
function taskHTML(l,t){
  const id=l.n+t,o=S()[id]||{},rev=revealed(o),c=K[l.k].c,txt=o.a||"";
  const n=words(txt);
  let h=`<div class="task" data-id="${id}"><h3>${t==="i"?"Impression question":"Explain why question"} <small>(4 marks)</small></h3>`;
  if(t==="i")h+=`<div class="src" style="--c:${c}"><b>Source A · practice extract</b>${l.src}</div>`;
  h+=`<div class="q">${t==="i"?l.iq:l.eq} (4 marks)</div><div class="starts">${STARTS[t]}</div>
  <textarea id="ta${id}" placeholder="Write your answer here…" aria-label="Your answer">${txt.replace(/</g,"&lt;")}</textarea>
  <div class="wc"><span id="wc${id}">${n} words</span><span>Aim for about 50-80 words</span></div>`;
  if(!rev&&view==="practice")h+=`<button class="btn go" data-act="check" data-id="${id}">Check my answer</button>`;
  if(!rev&&view==="exam"&&!examDone())h+=`<div class="ph" style="font-size:12.5px">Mark scheme appears when you finish the exam.</div>`;
  if(rev)h+=feedback(l,t,id,o,txt);
  return h+`</div>`;
}
function feedback(l,t,id,o,txt){
  const low=txt.toLowerCase();let h="";
  if(t==="i"){
    const hits=l.qt.map(q=>[q,low.includes(q.toLowerCase())]);
    h+=`<div class="box"><h4>Good words to quote</h4><div class="chips">${hits.map(x=>`<span class="chip ${x[1]?"hit":""}">${x[1]?"✓ ":""}“${x[0]}”</span>`).join("")}</div></div>`;
  }else{
    const hits=l.f.map(f=>[f[0],new RegExp(f[1],"i").test(txt)]);
    h+=`<div class="box"><h4>Facts you could include</h4><div class="chips">${hits.map(x=>`<span class="chip ${x[1]?"hit":""}">${x[1]?"✓ ":""}${x[0]}</span>`).join("")}</div></div>`;
  }
  const tk=o.t||[false,false,false,false],sc=tk.filter(Boolean).length;
  h+=`<div class="box ticks"><h4>Mark yourself</h4>${TICKS[t].map((x,i)=>`<label><input type="checkbox" data-tick="${id}" data-i="${i}" ${tk[i]?"checked":""}> ${x}</label>`).join("")}<div class="score" id="sc${id}">${sc} / 4</div></div>`;
  const model=t==="i"?l.im:l.h.replace(/(P:|E:|E:|L:)/g,m=>m).split(/(?=P:|E:|L:)/).map((p,i)=>{const names=["Point","Evidence","Explain","Link"];const body=p.replace(/^[PEL]:\s*/,"");return `<b>${names[i]||""}:</b> ${body}`}).join("<br>");
  h+=`<div class="model"><b>Model answer</b><br>${model}</div>`;
  return h;
}
function wire(l,ts){
  ts.forEach(t=>{
    const id=l.n+t,ta=$("ta"+id);
    if(ta)ta.oninput=()=>{const s=S();(s[id]=s[id]||{}).a=ta.value;save();$("wc"+id).textContent=words(ta.value)+" words";draw()};
  });
  panel.querySelectorAll('[data-act="check"]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,s=S();(s[id]=s[id]||{}).rev=true;save();openLesson(l.n);results();
  });
  panel.querySelectorAll("[data-tick]").forEach(cb=>cb.onchange=()=>{
    const id=cb.dataset.tick,s=S(),o=(s[id]=s[id]||{});o.t=o.t||[false,false,false,false];o.t[+cb.dataset.i]=cb.checked;save();
    $("sc"+id).textContent=o.t.filter(Boolean).length+" / 4";results();
    if(view==="exam"&&examDone())modebar();
  });
}

/* ===== RESULTS ===== */
function results(){
  const s=S();let totG=0,totM=0,totQ=0;
  const cards=Object.keys(K).map(k=>{
    let g=0,m=0,q=0;
    L.filter(l=>l.k===k).forEach(l=>(view==="exam"?examTasksFor(l.n):["i","e"]).forEach(t=>{
      const o=s[l.n+t];if(o&&o.t&&(view==="practice"?o.rev:examDone())&&o.t.some(Boolean)){g+=o.t.filter(Boolean).length;m+=4;q++}
      else if(o&&(view==="practice"?o.rev:examDone())&&o.a){m+=4;q++}
    }));
    totG+=g;totM+=m;totQ+=q;
    return `<div class="rc" style="--c:${K[k].c};--d:${K[k].d}"><b>${K[k].n}</b><div class="n">${g} / ${m}</div><div class="bar"><i style="width:${m?g/m*100:0}%"></i></div><small>${q} question${q===1?"":"s"} marked</small></div>`;
  }).join("");
  $("results").innerHTML=cards+`<div class="rc" style="--c:#7C5CFF"><b>All kingdoms</b><div class="n">${totG} / ${totM}</div><div class="bar"><i style="width:${totM?totG/totM*100:0}%"></i></div><small>${totM?Math.round(totG/totM*100)+"% · ":""}${totQ} marked</small></div>`;
}

 ["when","songhay","In which year did civil war weaken Songhay?","1588","1588"],
 ["when","benin","Around which year did Eweka become Oba?","About 1200 (c.1200)","1200"],
 ["when","benin","In which year did Britain invade Benin?","1897","1897"],
 ["when","asante","In which year did the Portuguese reach the Gold Coast?","1471","1471"],
 ["when","asante","In which year did the Portuguese build the fort at Elmina?","1482","1482"],
 ["when","asante","In which year did Osei Tutu defeat Denkyira?","1701","1701"],
 ["when","asante","In which year was the War of the Golden Stool?","1900","1900"],
 /* WHY · reasons */
 ["why","mali","Why did Sunjata fight Samanguru?","Samanguru put limits on Mandinka trade","trade|restrict|limit"],
 ["why","mali","Why was Musa’s Hajj important for Mali?","It spread Mali’s fame and brought back scholars","fame|reput|known|scholar|wealth|attention"],
 ["why","mali","Why did Mali decline after Mansa Musa?","Fights over succession, weak defence and lost trading centres","succession|rival|dispute|divis|fight"],
 ["why","mali","Why should historians check oral evidence with other sources?","It may stress some things and leave others out (bias)","bias|check|compar|stress|select|choose"],
 ["why","mali","Why did some earlier historians ignore African history?","Racism and not valuing oral traditions","racis|oral"],
 ["why","songhay","Why was the Niger River important to Songhay?","Transport, trade, food and a river fleet","transport|trade|food|fleet|boat"],
 ["why","songhay","Why did Songhay fall?","Civil war and the Moroccan invasion","civil|morocc|invasion|divid|succession"],
 ["why","songhay","Why is Askia Mohammed called ‘the Great’?","Strong army, Hajj, and support for scholars and learning","army|hajj|scholar|learn|educat|military"],
 ["why","benin","Why did Eweka’s Edo mother matter?","It helped local people accept his right to rule","local|edo|accept|claim|right"],
 ["why","benin","Why are the Benin Bronzes useful evidence?","They show court life, status, hierarchy and contact with Europeans","court|status|europe|hierarch|rank|trade"],
 ["why","benin","Why did the 1897 invasion have lasting effects?","Benin lost independence and its art and objects were taken abroad","independen|art|object|loot|abroad|colonial"],
 ["why","asante","Why is the Golden Stool so important to Asante?","It stands for the soul and unity of the people","soul|unity|sacred|identity|spirit"],
 ["why","asante","Why is Asante called the Kingdom of Gold?","It controlled gold mines and goldsmiths made gold objects","mine|goldsmith|gold"],
 ["why","asante","Why did Osei Tutu’s alliances matter?","They helped him beat Denkyira and unite Asante","denkyira|unite|united|beat|defeat|strong"],
 /* WHERE · places and key words */
 ["where","songhay","Which river was Songhay built around?","The Niger River","niger"],
 ["where","songhay","Which city on the Niger was the centre of Songhay?","Gao","gao"],
 ["where","songhay","Which people built boats and fished in Songhay?","The Sorko","sorko"],
 ["where","mali","Which city did Musa’s mosque building help make famous?","Timbuktu","timbuktu"],
 ["where","mali","In which city did Musa’s spending change the price of gold?","Cairo","cairo"],
 ["where","mali","Which people are linked to Mali’s foundation?","The Mandinka","mandinka"],
 ["where","benin","In which modern country was the Kingdom of Benin?","Nigeria","nigeria"],
 ["where","benin","Which city was the political centre of Benin?","Benin City","benin city|benin"],
 ["where","benin","Which people lived in the Kingdom of Benin?","The Edo","edo"],
 ["where","asante","In which modern country is the Gold Coast?","Ghana","ghana"],
 ["where","asante","Which group of related communities lived in the Gold Coast region?","The Akan","akan"],
 ["where","mali","What does ‘succession’ mean?","Passing power to a new ruler","pass|power|ruler|transfer|next"],
 ["where","mali","What is an ‘interpretation’?","A view or explanation of the past","view|explan|past|version"],
 ["where","mali","What is an ‘inference’?","A conclusion worked out from evidence","conclusion|evidence|work|deduc"]
];
const QCAT={
 all:{n:"All",c:"#7C5CFF"},
 who:{n:"Who? · names",c:"#E8743B"},
 what:{n:"What? · events",c:"#2F8FE0"},
 when:{n:"When? · dates",c:"#E0A100"},
 why:{n:"Why? · reasons",c:"#2DAA6B"},
 where:{n:"Where? · places & words",c:"#D6409F"}
};
store.q=store.q||{};
let qCat="all",qLen=10,qDeck=[],qI=0,qRight=0,qMissed=[],qChecked=false,qWasRight=false,qDone=false;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function qStart(pool){
  const base=pool||QBANK.filter(q=>qCat==="all"||q[0]===qCat);
  qDeck=shuffle(base);if(qLen&&!pool)qDeck=qDeck.slice(0,qLen);
  qI=0;qRight=0;qMissed=[];qChecked=false;qDone=false;qDraw();
}
function qSave(cat,ok){const r=(store.q[cat]=store.q[cat]||{r:0,t:0});r.t++;if(ok)r.r++;save()}
function qDraw(){
  const root=$("tQuiz");
  const catBtns=Object.keys(QCAT).map(k=>{
    const rec=k==="all"?Object.values(store.q).reduce((a,x)=>({r:a.r+x.r,t:a.t+x.t}),{r:0,t:0}):(store.q[k]||{r:0,t:0});
    return `<button class="pill" style="--c:${QCAT[k].c}" aria-pressed="${qCat===k}" data-cat="${k}">${QCAT[k].n}${rec.t?`<small>${Math.round(rec.r/rec.t*100)}%</small>`:""}</button>`}).join("");
  const lenBtns=[[10,"10 questions"],[0,"All of them"]].map(([v,l])=>`<button class="pill" style="--c:#7C5CFF" aria-pressed="${qLen===v}" data-len="${v}">${l}</button>`).join("");
  let card="";
  if(qDone){
    const pct=qDeck.length?Math.round(qRight/qDeck.length*100):0;
    card=`<div class="qcard" style="--c:#7C5CFF"><div class="big">${qRight} / ${qDeck.length}</div><div class="qtext" style="margin-top:0">${pct>=80?"Great work! 🎉":pct>=50?"Good effort. Practise the missed ones.":"Keep going. Try the missed ones again."}</div>
      ${qMissed.length?`<div class="miss"><b>To practise:</b>${qMissed.map(q=>`<div>${q[2]}<br><b style="color:var(--good)">${q[3]}</b></div>`).join("")}</div>`:`<div class="ph">No mistakes. Try the “All of them” round.</div>`}
      <div class="qbtns">${qMissed.length?`<button class="btn go" id="qMiss">Practise missed (${qMissed.length})</button>`:""}<button class="btn on" id="qNew">New round</button></div></div>`;
  }else if(qDeck.length){
    const q=qDeck[qI],cc=QCAT[q[0]].c;
    card=`<div class="qcard" style="--c:${cc}"><div><span class="qcat">${QCAT[q[0]].n.split(" ·")[0]}</span><span class="qk">${K[q[1]].n}</span></div>
      <div class="qtext">${q[2]}</div>
      <input class="qin" id="qin" type="text" autocomplete="off" placeholder="Type your answer…" aria-label="Your answer" ${qChecked?"disabled":""}>
      <div id="qres" aria-live="polite"></div>
      <div class="qbtns"><button class="btn go" id="qCheck" ${qChecked?"style=\"display:none\"":""}>Check (Enter)</button>
        <button class="btn" id="qSkip" ${qChecked?"style=\"display:none\"":""}>I don’t know</button>
        <button class="btn on" id="qNext" style="display:none">Next →</button></div></div>
      <div class="qprog"><i style="width:${qI/qDeck.length*100}%"></i></div><div class="qstat"><span>Question ${qI+1} of ${qDeck.length}</span><span>${qRight} right so far</span></div>`;
  }
  root.innerHTML=`<div class="qz"><div class="row"><span class="lab">Pick a type:</span>${catBtns}</div><div class="row"><span class="lab">Round:</span>${lenBtns}</div>${card}</div>`;
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{qCat=b.dataset.cat;qStart()});
  root.querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{qLen=+b.dataset.len;qStart()});
  if($("qNew"))$("qNew").onclick=()=>qStart();
  if($("qMiss"))$("qMiss").onclick=()=>qStart(qMissed.slice());
  if(qDone||!qDeck.length)return;
  const inp=$("qin"),q=qDeck[qI];
  const finish=(ok,skip)=>{
    qChecked=true;qWasRight=ok;inp.disabled=true;$("qCheck").style.display="none";$("qSkip").style.display="none";$("qNext").style.display="";
    qSave(q[0],ok);if(ok)qRight++;else qMissed.push(q);
    $("qres").innerHTML=ok?`<div class="qres ok"><b>✓ Correct!</b>${q[3]}</div>`
      :`<div class="qres no"><b>${skip?"Answer":"Not quite. The answer is:"}</b>${q[3]}</div><div class="qbtns" style="margin-top:8px"><button class="btn small" id="qOver">I was right, count it</button></div>`;
    if($("qOver"))$("qOver").onclick=()=>{qMissed.pop();qRight++;const r=store.q[q[0]];r.r++;save();qDraw2()};
    $("qNext").focus();
    root.querySelector(".qstat span:last-child").textContent=qRight+" right so far";
  };
  const qDraw2=()=>{root.querySelector(".qstat span:last-child").textContent=qRight+" right so far";$("qres").innerHTML=`<div class="qres ok"><b>✓ Counted. Well done!</b>${q[3]}</div>`};
  const check=()=>{const v=norm(inp.value);if(!v)return;finish(new RegExp(q[4],"i").test(v),false)};
  $("qCheck").onclick=check;
  $("qSkip").onclick=()=>finish(false,true);
  $("qNext").onclick=()=>{qI++;qChecked=false;if(qI>=qDeck.length)qDone=true;qDraw()};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  root.onkeydown=e=>{if(e.key==="Enter"&&qChecked&&e.target.id!=="qOver"&&e.target.id!=="qNext"){e.preventDefault();$("qNext").click()}};
  if(!qChecked)inp.focus();
}

/* ===== TABS ===== */
function tabTo(t){
  const q=t==="q";
  $("tTest").style.display=q?"none":"";$("tQuiz").style.display=q?"":"none";
  $("tb1").setAttribute("aria-selected",!q);$("tb2").setAttribute("aria-selected",q);
  if(q&&!qDeck.length&&!qDone)qStart();
}
$("tb1").onclick=()=>tabTo("t");$("tb2").onclick=()=>tabTo("q");

/* ===== START ===== */
draw();modebar();panelHome();results();tickTimer();
</script>
